<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" rx="16" fill="#E8F4FA"/>
  <!-- Sky -->
  <rect width="600" height="280" fill="#78C6F2"/>
  <circle cx="500" cy="80" r="40" fill="#FFFBEB" opacity="0.9"/>
  <path d="M470 70 L530 65 L510 80 Z" fill="#FFFFFF"/>
  <!-- Modern architectural canopy / Glass arches -->
  <path d="M260 0 L400 240 L280 500 L200 500 L300 240 L180 0 Z" fill="#A8D8F0" opacity="0.6"/>
  <line x1="260" y1="0" x2="400" y2="240" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="300" y1="40" x2="380" y2="200" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="330" y1="80" x2="360" y2="160" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Walkway & Plaza -->
  <path d="M0 320 L600 240 L600 500 L0 500 Z" fill="#E8A87C"/>
  <path d="M0 380 L600 320 L600 500 L0 500 Z" fill="#F4BD96"/>
  <path d="M0 430 L600 400 L600 500 L0 500 Z" fill="#FAE5D3"/>
  <path d="M0 470 L600 460 L600 500 L0 500 Z" fill="#68B684"/>
  
  <!-- Sleek White Sedan / Shuttle in background -->
  <g transform="translate(420, 260) scale(0.65)">
    <path d="M20 70 L60 30 L180 30 L220 70 L250 80 L250 110 L0 110 L0 80 Z" fill="#FFFFFF"/>
    <circle cx="60" cy="110" r="22" fill="#1E293B"/>
    <circle cx="190" cy="110" r="22" fill="#1E293B"/>
    <rect x="65" y="38" width="50" height="28" rx="2" fill="#38BDF8" opacity="0.6"/>
    <rect x="125" y="38" width="50" height="28" rx="2" fill="#38BDF8" opacity="0.6"/>
  </g>
  
  <!-- Walking Figures -->
  <g transform="translate(300, 280) scale(0.55)">
    <circle cx="20" cy="20" r="10" fill="#1E293B"/>
    <path d="M12 32 L28 32 L35 80 L25 80 L20 55 L15 80 L5 80 Z" fill="#1E293B"/>
  </g>
  <g transform="translate(450, 270) scale(0.45)">
    <circle cx="20" cy="20" r="10" fill="#0F172A"/>
    <path d="M12 32 L28 32 L35 80 L25 80 L20 55 L15 80 L5 80 Z" fill="#2563EB"/>
  </g>
</svg>