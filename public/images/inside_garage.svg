  <path d="M0 0 L600 0 L600 220 L0 220 Z" fill="#D96839"/>
  <rect x="60" y="30" width="480" height="15" rx="3" fill="#B24722"/>
  <rect x="60" y="65" width="480" height="15" rx="3" fill="#B24722"/>
  <rect x="60" y="100" width="480" height="15" rx="3" fill="#B24722"/>
  <rect x="60" y="135" width="480" height="15" rx="3" fill="#B24722"/>
  <circle cx="300" cy="100" r="28" fill="#43221A"/>
  
  <!-- Car cockpit / windshield interior frame -->
  <path d="M0 500 L80 260 L520 260 L600 500 Z" fill="#2A2242"/>
