  <rect x="250" y="380" width="100" height="40" rx="10" fill="#0F0C1B"/>
  
  <!-- Driver Silhouette from rear-left -->
  <path d="M50 500 C50 360, 90 320, 160 300 L250 300 C290 320, 310 380, 300 500 Z" fill="#0F0C1B"/>
  <!-- Driver Head & Neck -->
  <ellipse cx="200" cy="245" rx="42" ry="50" fill="#0F0C1B"/>
  <path d="M170 230 C170 190, 210 185, 235 200 C240 220, 240 250, 235 265 Z" fill="#D96839" opacity="0.85"/>
  <rect x="180" y="270" width="40" height="40" fill="#0F0C1B"/>
