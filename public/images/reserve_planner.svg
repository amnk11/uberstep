<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <rect width="500" height="350" rx="20" fill="#C6E4E8"/>
  <!-- Open Notebook Planner -->
  <g transform="rotate(-15 250 175)">
    <rect x="140" y="50" width="220" height="250" rx="8" fill="#FFFFFF" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.1))"/>
    <line x1="250" y1="50" x2="250" y2="300" stroke="#E5E7EB" stroke-width="2"/>
    <!-- Spiral binder -->
    <circle cx="250" cy="80" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="120" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="160" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="200" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="240" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="270" r="4" fill="#CBD5E1"/>
    <!-- Planner Lines -->
    <line x1="160" y1="90" x2="230" y2="90" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="120" x2="220" y2="120" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="150" x2="235" y2="150" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="180" x2="210" y2="180" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="90" x2="340" y2="90" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="120" x2="330" y2="120" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="150" x2="345" y2="150" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Watch laying diagonally -->
  <g transform="rotate(35 280 180)">
    <!-- Watch Strap -->
    <rect x="260" y="20" width="36" height="300" rx="8" fill="#8D5B4C"/>
    <!-- Watch Case -->
    <circle cx="278" cy="170" r="42" fill="#1E293B" stroke="#D1D5DB" stroke-width="4"/>
    <circle cx="278" cy="170" r="36" fill="#0F172A"/>
    <!-- Watch Hands -->
    <line x1="278" y1="170" x2="278" y2="145" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="278" y1="170" x2="295" y2="170" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="278" cy="170" r="3" fill="#FFFFFF"/>
  </g>
</svg>