<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" rx="16" fill="#3B82F6"/>
  <!-- Sunny Sky with Trees & Mountains -->
  <path d="M0 0 L600 0 L600 320 L0 320 Z" fill="#4B8BF5"/>
  <path d="M0 240 C120 180, 220 280, 360 200 C460 140, 550 220, 600 190 L600 350 L0 350 Z" fill="#255BB5"/>
  <circle cx="480" cy="180" r="70" fill="#1E7538"/>
  <circle cx="530" cy="220" r="60" fill="#2E9E4F"/>
  
  <!-- Golden Confetti / Sparkles -->
  <circle cx="220" cy="80" r="4" fill="#FBBF24"/>
  <circle cx="260" cy="110" r="5" fill="#FDE047"/>
  <circle cx="310" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="180" cy="120" r="4" fill="#FBBF24"/>
  <circle cx="330" cy="130" r="5" fill="#FDE047"/>
  <circle cx="240" cy="150" r="4" fill="#F59E0B"/>
  <polygon points="280,50 284,58 292,62 284,66 280,74 276,66 268,62 276,58" fill="#FCD34D"/>
  
  <!-- Modern Silver/White Car -->
  <g transform="translate(110, 300) scale(1.1)">
    <path d="M40 60 L100 20 L240 20 L300 60 L340 70 L340 100 L0 100 L0 70 Z" fill="#E2E8F0"/>
    <circle cx="70" cy="100" r="28" fill="#0F172A"/>
    <circle cx="270" cy="100" r="28" fill="#0F172A"/>
    <circle cx="70" cy="100" r="16" fill="#94A3B8"/>
    <circle cx="270" cy="100" r="16" fill="#94A3B8"/>
    <!-- Windows -->
    <path d="M105 25 L165 25 L165 55 L80 55 Z" fill="#1E293B"/>
    <path d="M175 25 L235 25 L260 55 L175 55 Z" fill="#1E293B"/>
  </g>
  
  <!-- Athlete / Creator leaning on car hood -->
  <g transform="translate(240, 240)">
    <ellipse cx="40" cy="20" rx="14" ry="16" fill="#D99B77"/>
    <path d="M26 14 C26 4, 38 0, 48 4 C54 10, 54 20, 50 24 Z" fill="#111827"/>
    <!-- Sunglasses -->
    <rect x="42" y="16" width="10" height="6" rx="1" fill="#000000"/>
    <!-- Torso in blue shirt & white sneakers -->
    <path d="M25 36 C25 36, 35 34, 55 34 C65 34, 70 42, 65 75 L30 75 Z" fill="#1E40AF"/>
    <!-- Arms crossed -->
    <path d="M30 45 C35 60, 55 60, 60 45" stroke="#D99B77" stroke-width="8" stroke-linecap="round"/>
    <!-- Jeans / Pants -->
    <path d="M30 75 L45 130 L58 130 L45 75 Z" fill="#000000"/>
    <!-- UberStep Sneakers -->
    <path d="M42 130 L65 130 C68 135, 65 142, 58 142 L38 142 Z" fill="#FFFFFF"/>
    <rect x="40" y="139" width="22" height="3" fill="#3B82F6"/>
  </g>
  
  <!-- Ground / Road -->
  <path d="M0 410 L600 410 L600 500 L0 500 Z" fill="#CBD5E1"/>
  <path d="M0 450 L600 450 L600 500 L0 500 Z" fill="#94A3B8"/>
</svg>