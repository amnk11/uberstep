<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Map Base Background -->
  <rect width="500" height="400" rx="16" fill="#E4E9EC"/>
  
  <!-- Water Body / River -->
  <path d="M260 0 C240 80, 270 160, 245 230 C220 300, 235 360, 220 400 L320 400 C340 340, 310 270, 335 200 C360 130, 330 60, 350 0 Z" fill="#99C9EA"/>
  
  <!-- Secondary Grid / Roads -->
  <line x1="0" y1="90" x2="500" y2="70" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="0" y1="180" x2="500" y2="190" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="0" y1="280" x2="500" y2="290" stroke="#FFFFFF" stroke-width="7"/>
  <line x1="120" y1="0" x2="140" y2="400" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="420" y1="0" x2="410" y2="400" stroke="#FFFFFF" stroke-width="6"/>
  
  <!-- Route Line (Dark Blue with glow) -->
  <path d="M130 330 L130 250 L200 220 L270 240 L340 180 L380 120" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pin Start (Black circle) -->
  <circle cx="130" cy="330" r="8" fill="#000000"/>
  <circle cx="130" cy="330" r="4" fill="#FFFFFF"/>
  
  <!-- Pin End (Square destination) -->
  <rect x="372" y="112" width="16" height="16" rx="3" fill="#000000"/>
  <rect x="376" y="116" width="8" height="8" rx="1" fill="#FFFFFF"/>

  <!-- Pulse marker on route -->
  <circle cx="270" cy="240" r="14" fill="#2563EB" opacity="0.25"/>
  <circle cx="270" cy="240" r="6" fill="#2563EB"/>
  
  <!-- Telemetry Badge Overlay -->
  <g transform="translate(20, 20)">
    <rect width="180" height="70" rx="10" fill="#FFFFFF" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.12))"/>
    <text x="14" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">PACE TELEMETRY</text>
    <text x="14" y="48" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">4:12 /km</text>
    <text x="14" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#10B981">⚡ Stride Efficiency +18%</text>
  </g>
</svg>